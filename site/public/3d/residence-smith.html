<!doctype html>
<html lang="zh-CN" style="--sky-top:#8bcbf9;--sky-mid:#e0effd;--sky-bot:#efe7da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Residence Smith · 3D 住宅模型</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    /* 模型加载前先铺一层钴蓝天空，杜绝黑块；JS 渲染后无缝衔接 */

      linear-gradient(to bottom,
        var(--sky-top, #8bcbf9) 0%,
        var(--sky-mid, #e0effd) 55%,
        var(--sky-bot, #efe7da) 100%);

  #stage {
    width: 100vw; height: 100vh; display: block;
    opacity: 1;
  }
